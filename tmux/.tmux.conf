# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'erikw/tmux-powerline'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
# tmux-continuum must be the LAST plugin: it installs its autosave timer by
# appending to status-right, and tmux-powerline overwrites status-right when
# it loads. Listing continuum after powerline keeps the hook alive.
set -g @plugin 'tmux-plugins/tmux-continuum'

# Session persistence across reboots.
set -g @resurrect-capture-pane-contents 'on'
# Added on top of resurrect's defaults (vi vim nvim emacs man less more
# tail top htop irssi weechat mutt) -- the two lists are concatenated.
set -g @resurrect-processes 'btop lazydocker'
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

setw -g aggressive-resize off

# Enable mouse support
set -g mouse on

# Set split window keys
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Modern colors
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Claude Code session state. Must stay BELOW the tpm line: tmux-powerline sets
# these two options when it loads and would otherwise clobber them.
#
# ~/.claude/hooks/tmux-claude-flag.sh publishes a per-window @claude_state:
#   busy ● green   Claude is working
#   idle ○ yellow  Claude is stopped / waiting on you
#   ask  ! red     Claude needs an answer (permission, question)
# No state -> the normal powerline label, so non-Claude windows look untouched.
#
# Inactive windows get a solid colored chip; the current window gets a light
# chip with colored text, so you can still tell which window you are in.
set -g window-status-format "#{?#{==:#{@claude_state},busy},#[fg=colour232]#[bg=colour114]#[bold] ● #I#{?window_flags,#F, } #W #[default],#{?#{==:#{@claude_state},idle},#[fg=colour232]#[bg=colour221]#[bold] ○ #I#{?window_flags,#F, } #W #[default],#{?#{==:#{@claude_state},ask},#[fg=colour232]#[bg=colour203]#[bold] ! #I#{?window_flags,#F, } #W #[default],#(~/.tmux/plugins/tmux-powerline/powerline.sh window-format)}}}"
set -g window-status-current-format "#{?#{==:#{@claude_state},busy},#[fg=colour28]#[bg=colour255]#[bold] ● #I#F #W #[default],#{?#{==:#{@claude_state},idle},#[fg=colour130]#[bg=colour255]#[bold] ○ #I#F #W #[default],#{?#{==:#{@claude_state},ask},#[fg=colour160]#[bg=colour255]#[bold] ! #I#F #W #[default],#(~/.tmux/plugins/tmux-powerline/powerline.sh window-current-format)}}}"
